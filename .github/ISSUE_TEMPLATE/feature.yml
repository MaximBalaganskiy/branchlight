name: Feature request
description: Describe a missing Git workflow or usability improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow or problem
      description: Explain what you are trying to accomplish and the current workaround.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
