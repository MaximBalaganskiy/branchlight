version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      aurelia:
        patterns: ["aurelia", "@aurelia/*", "@aurelia-ui-toolkits/*"]
      codemirror:
        patterns: ["@codemirror/*", "@lezer/*"]
  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
