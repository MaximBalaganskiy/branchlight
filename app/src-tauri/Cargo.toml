[package]
name = "branchlight"
version = "0.1.0"
description = "A local Git workspace"
edition = "2021"
default-run = "branchlight"

[lib]
name = "branchlight_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-window-state = "2"

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
