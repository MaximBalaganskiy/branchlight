<template>
  <div class="diff-empty" if.bind="isLoading">Loading diff…</div>
  <div class="diff-empty" if.bind="!isLoading && !text">Select a file to inspect its changes.</div>
  <div class="diff-code" if.bind="!isLoading && text" tabindex="0" aria-label="File diff">
    <div repeat.for="line of lines" class="diff-line ${line.kind}"><span class="line-number">${line.old}</span><span class="line-number">${line.next}</span><code>${line.text}</code></div>
    <div if.bind="truncated" class="diff-limit">Preview limited to 12,000 lines.</div>
  </div>
</template>
