<template class="flex min-h-0 min-w-0 flex-1 flex-col" keydown.trigger="onKey($event)">
  <ui-alert if.bind="error" tone="danger" role="alert" class="mb-2 shrink-0">${error}</ui-alert>
  <div class="mb-2 flex shrink-0 flex-wrap items-center gap-2">
    <strong class="mr-auto text-sm" aria-live="polite">${status}</strong>
    <button ui-icon-button click.trigger="navigate(-1)" disabled.bind="!remaining" aria-label="Previous conflict" title="Previous conflict · Shift+F7">↑</button>
    <button ui-icon-button click.trigger="navigate(1)" disabled.bind="!remaining" aria-label="Next conflict" title="Next conflict · F7">↓</button>
    <button ui-button click.trigger="toggleBase()" aria-pressed.bind="showBase">Common ancestor</button>
    <button ui-button click.trigger="openSearch()" title="Find and replace in result · Ctrl+F">Find / replace</button>
    <button ui-button click.trigger="toggleWrap()" aria-pressed.bind="wrapped">Word wrap</button>
    <button ui-button click.trigger="toggleSync()" aria-pressed.bind="syncScroll" title="Keep corresponding code in view when scrolling any pane">Sync scrolling</button>
    <button ui-button click.trigger="undo()" disabled.bind="busy || !ready" title="Undo · Ctrl+Z">Undo</button>
    <button ui-button click.trigger="redo()" disabled.bind="busy || !ready" title="Redo · Ctrl+Shift+Z">Redo</button>
  </div>
  <ui-form class="mb-2 block shrink-0">
    <ui-select class="col-span-3 min-w-0" if.bind="choices.length" label="Review conflict" items.bind="choices" value.bind="selectedConflict" value-field="id" label-field="label" change.trigger="selectConflict()" disabled.bind="busy">
      <ui-list><ui-list-item repeat.for="choice of $host.items; key: id" value.bind="choice">${choice.label}</ui-list-item></ui-list>
    </ui-select>
    <button ui-button class="col-span-2" click.trigger="accept('ours')" disabled.bind="!choices.length || busy">Accept ours</button>
    <button ui-button class="col-span-2" click.trigger="accept('theirs')" disabled.bind="!choices.length || busy">Accept theirs</button>
    <button ui-button class="col-span-2" click.trigger="accept('both')" disabled.bind="!choices.length || busy" title="Keep ours followed by theirs for this conflict">Both: ours first</button>
    <button ui-button class="col-span-3" click.trigger="accept('both-reversed')" disabled.bind="!choices.length || busy" title="Keep theirs followed by ours for this conflict">Both: theirs first</button>
    <button ui-button class="col-span-3 col-start-7" click.trigger="accept('manual')" disabled.bind="!choices.length || currentResolved || busy" title="Confirm the result you edited for the current conflict">Mark conflict resolved</button>
    <button ui-button class="col-span-3" click.trigger="reopen()" disabled.bind="!currentResolved || busy" title="Mark this conflict unresolved while keeping its current text">Reopen conflict</button>
  </ui-form>
  <ui-form if.bind="searchOpen" class="mb-2 block shrink-0" submit.trigger:prevent="search('next')">
    <ui-input class="col-span-3 min-w-0" data-merge-search label="Find in result" value.bind="searchText">
      <span au-slot="leading">⌕</span>
      <span au-slot="helper" role="status">${searchStatus}</span>
    </ui-input>
    <ui-input class="col-span-3 min-w-0" label="Replace with" value.bind="replacement"></ui-input>
    <button ui-button class="col-span-3" click.trigger="search('previous')">Previous match</button>
    <button ui-button class="col-span-3" type="submit">Next match</button>
    <ui-checkbox class="col-span-3" checked.bind="matchCase">Match case</ui-checkbox>
    <ui-checkbox class="col-span-3" checked.bind="regexp">Regex</ui-checkbox>
    <button ui-button class="col-span-3" click.trigger="search('replace')" disabled.bind="busy">Replace</button>
    <button ui-button class="col-span-3" click.trigger="search('all')" disabled.bind="busy">Replace all</button>
    <button ui-icon-button class="col-span-1 col-start-12 justify-self-end" click.trigger="searchOpen = false" aria-label="Close search">×</button>
  </ui-form>
  <div class="merge-panes flex min-h-0 min-w-0 flex-1 overflow-hidden rounded border border-card-border">
    <section class="merge-pane merge-side">
      <h3 title="Read only · differences from the result">
        Ours
        <span>Compared with result</span>
      </h3>
      <div class="merge-code-body">
        <div class="code-editor" ref="oursHost"></div>
        <div class="merge-controls">
          <template repeat.for="control of controls"><button ui-icon-button if.bind="control.pane === 1" style="top: ${control.top}px" click.trigger="inlineAccept(control)" disabled.bind="busy" aria-label="Accept ours for conflict ${control.id + 1}" title="Accept ours for conflict ${control.id + 1}">→</button></template>
        </div>
      </div>
    </section>
    <ui-splitter size.bind="oursSize" min="140" max="650" storage-key="merge-ours" aria-label="Resize ours pane"></ui-splitter>
    <section class="merge-pane merge-result flex-1">
      <h3>
        Result
        <span>Editable · compared with ancestor</span>
      </h3>
      <div class="merge-code-body">
        <div class="code-editor" ref="resultHost"></div>
        <div class="merge-controls">
          <template repeat.for="control of controls"><button ui-icon-button if.bind="control.pane === 0" style="top: ${control.top}px" click.trigger="inlineAccept(control)" disabled.bind="busy" aria-label="${control.resolved ? 'Reopen' : 'Mark resolved'} conflict ${control.id + 1}" title="${control.resolved ? 'Reopen' : 'Mark resolved'} conflict ${control.id + 1}">${control.resolved ? '↶' : '✓'}</button></template>
        </div>
      </div>
    </section>
    <ui-splitter target="next" size.bind="theirsSize" min="140" max="650" storage-key="merge-theirs" aria-label="Resize theirs pane"></ui-splitter>
    <section class="merge-pane merge-side">
      <h3 title="Read only · differences from the result">
        Theirs
        <span>Compared with result</span>
      </h3>
      <div class="merge-code-body">
        <div class="code-editor" ref="theirsHost"></div>
        <div class="merge-controls">
          <template repeat.for="control of controls"><button ui-icon-button if.bind="control.pane === 2" style="top: ${control.top}px" click.trigger="inlineAccept(control)" disabled.bind="busy" aria-label="Accept theirs for conflict ${control.id + 1}" title="Accept theirs for conflict ${control.id + 1}">←</button></template>
        </div>
      </div>
    </section>
  </div>
  <ui-splitter show.bind="showBase" direction="vertical" target="next" size="160" min="80" max="350" storage-key="merge-ancestor" aria-label="Resize ancestor pane"></ui-splitter>
  <section show.bind="showBase" class="merge-pane merge-ancestor shrink-0 overflow-hidden rounded border border-card-border">
    <h3>
      Common ancestor
      <span>Read only · entire file</span>
    </h3>
    <div class="code-editor" ref="baseHost"></div>
  </section>
  <p class="mt-2 shrink-0 text-xs text-ink-500">Amber: unresolved · Green edge: resolved · Highlighted words: differences. Unresolved regions initially show ours; accept a side or edit and mark resolved.</p>
  <p if.bind="alignmentLimited" class="shrink-0 text-xs text-warning-text">Alignment is simplified because these files differ substantially.</p>
  <p if.bind="wrapped" class="shrink-0 text-xs text-ink-500">Wrapped panes scroll to corresponding code; turn wrapping off for exact row alignment.</p>
</template>
