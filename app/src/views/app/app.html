<import from="../history/history"></import>
<import from="../commit/commit"></import>
<import from="../welcome/welcome"></import>
<import from="../../elements/repository-switcher/repository-switcher"></import>

<div class="app-shell flex h-dvh flex-col overflow-hidden">
  <header class="topbar flex min-h-11 shrink-0 items-center gap-3 border-b border-card-border bg-card-muted px-3 py-1">
    <strong class="app-name text-xs font-medium text-ink-500">Branchlight</strong>
    <repository-switcher if.bind="!workspace.initializing && workspace.mode === 'browse'"></repository-switcher>
    <div class="topbar-context flex items-center gap-4" if.bind="workspace.snapshot">
      <strong if.bind="workspace.mode === 'commit'" title.bind="workspace.repo">${workspace.snapshot.name}</strong>
      <span class="branch-pill rounded bg-info-bg px-2 py-1 text-xs whitespace-nowrap text-info-text">${workspace.snapshot.branch}</span>
    </div>
    <div class="spacer flex-1"></div>
    <button ui-icon-button click.trigger="toggleDensity()" aria-label="Toggle density" title="Density: ${appearance.density === 'normal' ? 'Normal' : 'Compact'} · Switch to ${appearance.density === 'normal' ? 'Compact' : 'Normal'}">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d.bind="appearance.density === 'normal' ? 'M 3 4 H 17 M 3 10 H 17 M 3 16 H 17' : 'M 3 4 H 17 M 3 8 H 17 M 3 12 H 17 M 3 16 H 17'"></path>
      </svg>
    </button>
    <button ui-icon-button click.trigger="toggleTheme()" aria-label="Toggle theme" title="Toggle theme">◐</button>
    <button ui-button if.bind="workspace.mode === 'commit'" click.trigger="workspace.refresh()" disabled.bind="workspace.busy">Refresh</button>
  </header>

  <main if.bind="!workspace.snapshot && (workspace.initializing || workspace.refreshing)" class="grid min-h-0 flex-1 place-items-center bg-card text-sm text-ink-500" role="status">Loading repository…</main>
  <welcome if.bind="!workspace.snapshot && !workspace.initializing && !workspace.refreshing && workspace.mode === 'browse'"></welcome>
  <main if.bind="!workspace.snapshot && !workspace.initializing && !workspace.refreshing && workspace.mode === 'commit'" class="flex min-h-0 flex-1 flex-col items-center justify-center gap-3 bg-card text-sm text-ink-500">
    <p>Could not load this repository.</p>
    <button ui-button click.trigger="workspace.refresh()">Retry</button>
  </main>
  <history if.bind="workspace.snapshot && workspace.mode === 'browse'"></history>
  <commit if.bind="workspace.snapshot && workspace.mode === 'commit'"></commit>

  <footer class="statusbar flex h-[27px] shrink-0 items-center gap-2.5 border-t border-card-border bg-card-muted px-4 text-[10px] text-ink-500">
    <span class="status-dot mr-1 inline-block size-[5px] shrink-0 rounded-full bg-success-border ${workspace.busy || workspace.refreshing ? 'pulsing' : ''}"></span>
    <span>${workspace.busy ? 'Running Git operation…' : workspace.refreshing ? 'Refreshing…' : 'Ready'}</span>
    <span if.bind="workspace.snapshot">${workspace.snapshot.branch} ${tracking}</span>
    <div class="spacer flex-1"></div>
    <span if.bind="workspace.snapshot">${workspace.snapshot.files.length} changes</span>
  </footer>
</div>
