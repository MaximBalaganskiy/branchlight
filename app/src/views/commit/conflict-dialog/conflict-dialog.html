<template class="conflict-editor flex h-[90vh] w-[94vw] min-w-0 max-w-[1500px] flex-col overflow-hidden p-4" keydown.trigger="onKey($event)">
  <import from="../../../elements/code-editor/code-editor"></import>
  <h2 class="mb-2 shrink-0 truncate text-lg!" title.bind="path">Resolve conflict: ${path}</h2>
  <p if.bind="workspace.snapshot.operation === 'Rebase'" class="mb-2 shrink-0 text-sm text-warning-text">During rebase, Ours is the new base plus commits already replayed. Theirs is the commit being replayed.</p>
  <ui-alert if.bind="error" tone="danger" role="alert" class="mb-2 shrink-0">${error}</ui-alert>
  <ui-alert if.bind="confirmDiscard" tone="warning" class="mb-2 shrink-0">
    Discard your unsaved resolution?
    <button ui-button click.trigger="confirmDiscard = false">Keep editing</button>
    <button ui-button danger click.trigger="discard()">Discard edits</button>
  </ui-alert>
  <template if.bind="content">
    <div class="mb-2 flex shrink-0 flex-wrap items-center gap-2">
      <strong class="mr-auto text-sm" aria-live="polite">${conflictStatus}</strong>
      <button ui-icon-button click.trigger="navigate(-1)" disabled.bind="!conflicts.length" aria-label="Previous conflict" title="Previous conflict · Shift+F7">↑</button>
      <button ui-icon-button click.trigger="navigate(1)" disabled.bind="!conflicts.length" aria-label="Next conflict" title="Next conflict · F7">↓</button>
      <button ui-button click.trigger="accept('ours')" disabled.bind="!current || workspace.busy">Accept ours</button>
      <button ui-button click.trigger="accept('theirs')" disabled.bind="!current || workspace.busy">Accept theirs</button>
      <button ui-button click.trigger="accept('both')" disabled.bind="!current || workspace.busy" title="Keep ours followed by theirs for this conflict">Both: ours first</button>
      <button ui-button click.trigger="accept('both-reversed')" disabled.bind="!current || workspace.busy" title="Keep theirs followed by ours for this conflict">Both: theirs first</button>
    </div>
    <div class="merge-sources flex h-[200px] shrink-0 overflow-hidden rounded border border-card-border">
      <section class="merge-source">
        <h3>Ours · ${current ? 'current conflict' : 'entire file'}</h3>
        <code-editor value.to-view="sourceOurs" file-path.bind="path" read-only.bind="true" label="Ours"></code-editor>
      </section>
      <section class="merge-source">
        <h3>Common ancestor · ${ancestor !== null ? 'current conflict' : 'entire file'}</h3>
        <code-editor value.to-view="sourceBase" file-path.bind="path" read-only.bind="true" label="Common ancestor"></code-editor>
      </section>
      <section class="merge-source">
        <h3>Theirs · ${current ? 'current conflict' : 'entire file'}</h3>
        <code-editor value.to-view="sourceTheirs" file-path.bind="path" read-only.bind="true" label="Theirs"></code-editor>
      </section>
    </div>
    <ui-splitter direction="vertical" size="200" min="100" max="400" storage-key="merge-sources" aria-label="Resize conflict sources and result"></ui-splitter>
    <section if.bind="content.editable" class="flex min-h-0 flex-1 flex-col overflow-hidden rounded border border-card-border">
      <div class="flex shrink-0 items-center gap-2 bg-card-muted px-3 py-1">
        <h3 class="mr-auto text-sm">Result · entire file</h3>
        <button ui-button if.bind="!hasMarkerConflicts" click.trigger="resolve('ours')" disabled.bind="workspace.busy">Use ours and stage</button>
        <button ui-button if.bind="!hasMarkerConflicts" click.trigger="resolve('theirs')" disabled.bind="workspace.busy">Use theirs and stage</button>
        <button ui-button click.trigger="editor.undo()" disabled.bind="workspace.busy" title="Undo · Ctrl+Z">Undo</button>
        <button ui-button click.trigger="editor.redo()" disabled.bind="workspace.busy" title="Redo · Ctrl+Shift+Z">Redo</button>
      </div>
      <code-editor component.ref="editor" value.two-way="result" file-path.bind="path" read-only.bind="workspace.busy" label="Resolved content" cursor-moved.trigger="cursorMoved($event.detail)"></code-editor>
    </section>
    <div else class="flex min-h-0 flex-1 flex-col justify-center gap-3 p-4">
      <p>This binary, large or missing file cannot be edited here. Choose an entire side or resolve it externally.</p>
      <div class="flex gap-2">
        <button ui-button click.trigger="resolve('ours')" disabled.bind="workspace.busy">Use ours and stage</button>
        <button ui-button click.trigger="resolve('theirs')" disabled.bind="workspace.busy">Use theirs and stage</button>
      </div>
    </div>
  </template>
  <div class="mt-3 flex shrink-0 flex-wrap items-center justify-end gap-2">
    <span class="mr-auto text-xs text-ink-500">Choices stay in this editor until saved. Ctrl+Z undoes choices and typing.</span>
    <button ui-button click.trigger="close()" disabled.bind="workspace.busy">Close</button>
    <button ui-button click.trigger="resolve('mark')" disabled.bind="workspace.busy || !content">Mark externally resolved</button>
    <button ui-button primary if.bind="content.editable" click.trigger="resolve('edit')" disabled.bind="workspace.busy">Save result and stage</button>
  </div>
</template>
