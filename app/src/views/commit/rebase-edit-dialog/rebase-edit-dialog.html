<template class="repository-tool-dialog grid w-[650px] max-w-[90vw] min-w-0 gap-4 overflow-auto p-5">
  <h2 class="text-xl!">Edit paused commit</h2>
  <ui-form class="block">
    <ui-input class="col-span-12" textarea rows="10" label="Paused commit message" value.bind="message & validate" disabled.bind="workspace.busy || loading"><span au-slot="helper">Amend ${head.slice(0, 10)} with this message and any staged changes. Stage only the changes you want in this commit before amending. Then continue the rebase.</span></ui-input>
    <ui-alert class="col-span-12" if.bind="error" tone="danger" role="alert">${error}</ui-alert>
    <button ui-button class="col-span-6" click.trigger="close()" disabled.bind="workspace.busy">Cancel</button>
    <button ui-button class="col-span-6" primary click.trigger="amend()" disabled.bind="workspace.busy || loading">Amend paused commit</button>
  </ui-form>
</template>
