<template class="w-[520px] max-w-[90vw] max-h-[90vh] overflow-auto p-6">
  <h2 class="mb-4 text-xl!">${title}</h2>
  <p class="mb-4 break-words text-sm">
    <strong>${model.branch.name}</strong>
    · ${model.branch.hash.slice(0, 8)}
  </p>
  <ui-form class="block" submit.trigger:prevent="save()">
    <ui-input class="col-span-12" if.bind="model.action === 'rename'" label="New branch name" value.bind="name & validate" disabled.bind="workspace.busy" required></ui-input>
    <ui-select class="col-span-12" if.bind="model.action === 'upstream'" label="Upstream branch" items.bind="upstreams" value.bind="upstream" value-field="fullName" label-field="name" disabled.bind="workspace.busy">
      <ui-list><ui-list-item repeat.for="branch of $host.items" value.bind="branch">${branch.name}</ui-list-item></ui-list>
      <span au-slot="helper">Pull and push use this remote branch. Fetch first if it is missing from this list.</span>
    </ui-select>
    <div if.bind="model.action === 'delete'" class="col-span-12 grid gap-3">
      <p class="text-sm">Delete this local branch? Branches checked out in any worktree cannot be deleted.</p>
      <ui-checkbox checked.bind="force" disabled.bind="workspace.busy">Delete even if the branch has unmerged commits</ui-checkbox>
      <p if.bind="force" class="text-sm text-warning-text">Unmerged commits may become unreachable. Keep another branch or tag if you need them.</p>
    </div>
    <ui-alert class="col-span-12" if.bind="error" tone="danger" role="alert">${error}</ui-alert>
    <button ui-button class="col-span-6" type="button" click.trigger="cancel()" disabled.bind="workspace.busy">Cancel</button>
    <button ui-button class="col-span-6" primary.bind="model.action !== 'delete'" danger.bind="model.action === 'delete'" type="submit" formnovalidate disabled.bind="workspace.busy || (model.action === 'rename' && name.trim() === model.branch.name)">${title}</button>
  </ui-form>
</template>
