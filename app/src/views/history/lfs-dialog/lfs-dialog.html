<template class="repository-tool-dialog flex w-[850px] max-w-[90vw] max-h-[90vh] min-w-0 flex-col gap-3 overflow-hidden p-5">
  <h2 class="text-xl!">Git LFS</h2>
  <p if.bind="info && !info.installed">Git LFS was not found. Install Git LFS on this computer, then refresh.</p>
  <template if.bind="info.installed">
    <div class="flex items-center gap-3">
      <span class="flex-1 text-sm text-ink-500">${info.version}</span>
      <button ui-button click.trigger="act('lfs-install', {})" disabled.bind="workspace.busy">Enable LFS for this repository</button>
    </div>
    <div class="min-h-0 flex-1 overflow-auto">
      <h3>Tracking patterns</h3>
      <pre class="whitespace-pre-wrap break-all text-sm">${info.tracking || 'No LFS patterns.'}</pre>
      <h3 class="mt-3">LFS files</h3>
      <pre class="whitespace-pre-wrap break-all text-sm">${info.files || 'No LFS files.'}</pre>
      <h3 class="mt-3">Transfer status</h3>
      <pre class="whitespace-pre-wrap break-all text-sm">${info.status}</pre>
    </div>
    <ui-form class="block shrink-0">
      <ui-input class="col-span-6 min-w-0" label="LFS file pattern" placeholder="*.psd" value.bind="pattern & validate"><span au-slot="helper">Commit .gitattributes and re-stage matching files to apply tracking. Existing history is not rewritten.</span></ui-input>
      <button ui-button class="col-span-3" click.trigger="track('lfs-track')" disabled.bind="workspace.busy">Track pattern</button>
      <button ui-button class="col-span-3" click.trigger="track('lfs-untrack')" disabled.bind="workspace.busy">Untrack pattern</button>
      <ui-select class="col-span-3 min-w-0" label="LFS remote" items.bind="remotes" value.bind="remote & validate" value-field="name" label-field="name">
        <ui-list><ui-list-item repeat.for="remote of $host.items; key: name" value.bind="remote">${remote.name}</ui-list-item></ui-list>
      </ui-select>
      <button ui-button class="col-span-3" click.trigger="transfer('lfs-fetch')" disabled.bind="!remote || workspace.busy">Fetch LFS objects</button>
      <button ui-button class="col-span-3" click.trigger="transfer('lfs-pull')" disabled.bind="!remote || workspace.busy">Download into checkout</button>
      <button ui-button class="col-span-3" click.trigger="transfer('lfs-push')" disabled.bind="!remote || workspace.busy">Push LFS objects</button>
    </ui-form>
  </template>
  <ui-alert if.bind="error" tone="danger" role="alert">${error}</ui-alert>
  <p role="status" class="text-sm">${status}</p>
  <div class="flex justify-end gap-2">
    <button ui-button click.trigger="refresh()" disabled.bind="loading || workspace.busy">Refresh LFS</button>
    <button ui-button click.trigger="close()" disabled.bind="loading || workspace.busy">Close</button>
  </div>
</template>
