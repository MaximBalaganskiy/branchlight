<template class="branch-dialog w-[430px] max-w-[90vw] p-6">
  <h2>Create branch</h2>
  <ui-form class="block" submit.trigger:prevent="save()">
    <ui-input class="col-span-12" label="Branch name" value.bind="name & validate" placeholder="feature/my-change" required autofocus>
      <span au-slot="helper">Create and check out a branch from ${reference || 'the current commit'}.</span>
    </ui-input>
    <ui-alert class="col-span-12" if.bind="error" tone="danger" role="alert">${error}</ui-alert>
    <button ui-button class="col-span-6" type="button" click.trigger="cancel()">Cancel</button>
    <button ui-button class="col-span-6" primary type="submit" formnovalidate disabled.bind="workspace.busy">Create branch</button>
  </ui-form>
</template>
