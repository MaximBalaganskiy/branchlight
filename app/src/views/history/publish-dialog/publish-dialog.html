<template class="w-[480px] max-w-[90vw] p-6">
  <h2 class="mb-4 text-xl!">Publish branch</h2>
  <p class="mb-4 text-sm text-ink-500">Push ${source} and configure its upstream for future pulls and pushes.</p>
  <ui-form class="block" submit.trigger:prevent="publish()">
    <ui-select class="col-span-12" label="Remote" items.bind="remotes" value.bind="remote & validate" value-field="name" label-field="name" disabled.bind="workspace.busy">
      <ui-list><ui-list-item repeat.for="remote of $host.items" value.bind="remote">${remote.name}</ui-list-item></ui-list>
      <span au-slot="helper" if.bind="!remotes.length">Add a remote using the + button in the Remotes tree.</span>
    </ui-select>
    <ui-input class="col-span-12" label="Remote branch" value.bind="branch & validate" disabled.bind="workspace.busy" required></ui-input>
    <ui-alert class="col-span-12" if.bind="error" tone="danger" role="alert">${error}</ui-alert>
    <button ui-button class="col-span-6" type="button" click.trigger="close()" disabled.bind="workspace.busy">Cancel</button>
    <button ui-button class="col-span-6" primary type="submit" formnovalidate disabled.bind="workspace.busy || !remotes.length">Publish branch</button>
  </ui-form>
</template>
