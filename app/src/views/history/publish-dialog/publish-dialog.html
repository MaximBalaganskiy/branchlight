<template class="w-[480px] max-w-[90vw] p-6">
  <h2 class="mb-4 text-xl!">Publish branch</h2>
  <p class="mb-4 text-sm text-ink-500">Push ${source} and configure its upstream for future pulls and pushes.</p>
  <form class="grid gap-4" submit.trigger:prevent="publish()">
    <ui-select label="Remote" items.bind="remotes" value.bind="remote" value-field="name" label-field="name" disabled.bind="workspace.busy"></ui-select>
    <ui-input label="Remote branch" value.bind="branch" disabled.bind="workspace.busy" required></ui-input>
    <p if.bind="!remotes.length" class="text-sm text-ink-500">Add a remote in the Remotes dialog first.</p>
    <ui-alert if.bind="error" tone="danger" role="alert">${error}</ui-alert>
    <div class="flex justify-end gap-2">
      <button ui-button type="button" click.trigger="close()" disabled.bind="workspace.busy">Cancel</button>
      <button ui-button primary type="submit" disabled.bind="workspace.busy || !remote || !branch.trim()">Publish branch</button>
    </div>
  </form>
</template>
