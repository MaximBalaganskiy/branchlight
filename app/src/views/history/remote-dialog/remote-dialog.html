<template class="w-[600px] max-w-[90vw] max-h-[90vh] overflow-auto p-6">
  <h2 class="text-xl!">${editing ? 'Edit remote ' + name : 'Add remote'}</h2>
  <ui-form class="block" submit.trigger:prevent="save()">
    <ui-input class="col-span-12" label="Remote name" value.bind="name & validate" readonly.bind="editing" disabled.bind="workspace.busy" required></ui-input>
    <ui-input class="col-span-12" label="Remote URL" value.bind="url & validate" disabled.bind="workspace.busy" required></ui-input>
    <ui-input class="col-span-12" label="Push URL (optional)" value.bind="pushUrl" disabled.bind="workspace.busy"><span au-slot="helper">Leave empty to use the remote URL for pushes.</span></ui-input>
    <ui-checkbox class="col-span-12" checked.bind="prune" disabled.bind="workspace.busy">Prune deleted remote branches when fetching</ui-checkbox>
    <ui-alert class="col-span-12" if.bind="error" tone="danger" role="alert">${error}</ui-alert>
    <button ui-button class="col-span-6" type="button" click.trigger="cancel()" disabled.bind="workspace.busy">Cancel</button>
    <button ui-button class="col-span-6" primary type="submit" formnovalidate disabled.bind="workspace.busy">${editing ? 'Save remote' : 'Create remote'}</button>
  </ui-form>
</template>
