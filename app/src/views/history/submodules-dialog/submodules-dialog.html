<template class="repository-tool-dialog flex w-[850px] max-w-[90vw] max-h-[90vh] min-w-0 flex-col gap-3 overflow-hidden p-5">
  <h2 class="text-xl!">Submodules</h2>
  <p class="text-sm text-ink-500">Initialize or update to the commit recorded by the parent repository. Sync refreshes URLs from .gitmodules. Add/remove changes must be committed in the parent.</p>
  <div class="min-h-0 flex-1 overflow-auto">
    <div repeat.for="module of modules; key: path" class="mb-3 grid gap-2 rounded border border-card-border p-3">
      <strong>${module.path}</strong>
      <span class="text-sm text-ink-500">Recorded: ${module.target.slice(0, 10)} · Checked out: ${module.head ? module.head.slice(0, 10) : 'Not initialized'} ${module.dirty ? '· Local changes' : ''} ${module.head && module.head !== module.target ? '· Different commit' : ''}</span>
      <div class="flex flex-wrap gap-2">
        <button ui-button click.trigger="operate('submodule-update', module)" disabled.bind="workspace.busy || module.dirty">${module.head ? 'Update checkout' : 'Initialize'}</button>
        <button ui-button click.trigger="operate('submodule-sync', module)" disabled.bind="workspace.busy">Sync URL</button>
        <button ui-button click.trigger="open(module)" disabled.bind="workspace.busy || !module.head">Open repository</button>
        <button ui-button danger click.trigger="removing = module.path" disabled.bind="workspace.busy || module.dirty">Remove…</button>
        <button ui-button danger if.bind="removing === module.path" click.trigger="operate('submodule-remove', module)" disabled.bind="workspace.busy">Confirm removal</button>
      </div>
    </div>
    <p if.bind="!modules.length">${loading ? 'Loading…' : 'No submodules.'}</p>
  </div>
  <ui-form class="block shrink-0 border-t border-card-border" submit.trigger:prevent="add()">
    <ui-input class="col-span-12" label="Submodule URL" value.bind="url & validate"></ui-input>
    <ui-input class="col-span-8" label="Submodule path" value.bind="path & validate"></ui-input>
    <button ui-button class="col-span-4" primary type="submit" formnovalidate disabled.bind="workspace.busy || loading">Add submodule</button>
  </ui-form>
  <ui-alert if.bind="error" tone="danger" role="alert">${error}</ui-alert>
  <p role="status" class="text-sm">${status}</p>
  <div class="flex justify-end gap-2">
    <button ui-button click.trigger="refresh()" disabled.bind="loading || workspace.busy">Refresh submodules</button>
    <button ui-button click.trigger="close()" disabled.bind="loading || workspace.busy">Close</button>
  </div>
</template>
