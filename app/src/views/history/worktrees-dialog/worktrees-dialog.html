<template class="worktree-manager w-[700px] max-w-[90vw] max-h-[85vh] overflow-auto p-6">
  <h2 class="mb-4 text-xl!">Worktrees</h2>
  <div class="mb-4 grid gap-2">
    <div repeat.for="tree of trees; key: path" class="flex items-center gap-3 rounded border border-card-border p-3">
      <div class="min-w-0 flex-1">
        <strong>${tree.branch || 'Detached HEAD'}</strong>
        <span class="ml-2 text-xs text-ink-500">${isCurrent(tree) ? 'Current' : tree.main ? 'Main' : tree.locked ? 'Locked' : ''}</span>
        <div class="truncate text-xs text-ink-500" title.bind="tree.path">${tree.path}</div>
      </div>
      <button ui-button click.trigger="open(tree)" disabled.bind="workspace.busy || isCurrent(tree)">Open</button>
      <button ui-icon-button aria-label="Remove worktree ${tree.branch}" title="Remove worktree" if.bind="!tree.main && !isCurrent(tree) && !tree.locked" click.trigger="removing = tree" disabled.bind="workspace.busy">×</button>
    </div>
  </div>
  <ui-alert if.bind="error" tone="danger" role="alert">${error}</ui-alert>
  <div if.bind="removing" class="my-4 grid gap-3">
    <p>
      Remove worktree
      <strong>${removing.path}</strong>
      ? Git will refuse if it contains uncommitted or untracked files. Its branch will remain.
    </p>
    <div class="flex justify-end gap-2">
      <button ui-button click.trigger="removing = null">Cancel removal</button>
      <button ui-button danger click.trigger="remove()" disabled.bind="workspace.busy">Remove worktree</button>
    </div>
  </div>
  <form else class="grid gap-3" submit.trigger:prevent="create()">
    <h3 class="font-semibold">Create worktree</h3>
    <ui-input label="New branch" value.bind="name" required></ui-input>
    <ui-input label="Worktree folder (absolute path)" value.bind="directory" required></ui-input>
    <ui-input label="Start from branch or commit" value.bind="reference" required></ui-input>
    <div class="flex justify-end gap-2">
      <button ui-button type="button" click.trigger="close()" disabled.bind="workspace.busy">Close</button>
      <button ui-button primary type="submit" disabled.bind="workspace.busy || loading || !name.trim() || !directory.trim() || !reference.trim()">Create worktree</button>
    </div>
  </form>
</template>
