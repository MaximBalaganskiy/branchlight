<template class="w-[560px] max-w-[90vw] max-h-[90vh] overflow-auto p-6">
  <h2 class="text-xl!">${mode === 'clone' ? 'Clone repository' : 'Create repository'}</h2>
  <ui-form class="block" submit.trigger:prevent="create()">
    <ui-input class="col-span-12" if.bind="mode === 'clone'" label="Repository URL or local path" value.bind="url & validate" disabled.bind="working" required><span au-slot="helper">Authentication uses your configured Git credential helper or SSH agent.</span></ui-input>
    <ui-input class="col-span-9 min-w-0" label="Destination folder" value.bind="directory & validate" disabled.bind="working" required>
      <span au-slot="helper">${mode === 'clone' ? 'Choose a new or empty folder.' : 'Existing files are kept. Choose a folder outside another Git repository.'}</span>
    </ui-input>
    <button ui-button class="col-span-3" type="button" click.trigger="browse()" disabled.bind="working">Browse…</button>
    <ui-input class="col-span-12" if.bind="mode === 'init'" label="Initial branch" value.bind="branch & validate" disabled.bind="working" required></ui-input>
    <p if.bind="working" role="status" class="col-span-12 text-sm text-ink-500">${mode === 'clone' ? 'Cloning repository… This can take a few minutes.' : 'Creating repository…'}</p>
    <ui-alert class="col-span-12" if.bind="error" tone="danger" role="alert">${error}</ui-alert>
    <button ui-button class="col-span-6" type="button" click.trigger="cancel()" disabled.bind="working">Cancel</button>
    <button ui-button class="col-span-6" primary type="submit" formnovalidate disabled.bind="working">${mode === 'clone' ? 'Clone and open' : 'Create and open'}</button>
  </ui-form>
</template>
